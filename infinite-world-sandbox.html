<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaniNingen Infinite World Sandbox W1A</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101a22; }
    #viewport { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 2; min-width: min(470px, calc(100vw - 28px));
      padding: 13px 15px; border: 1px solid rgba(198, 231, 167, 0.38); border-radius: 10px;
      background: rgba(11, 20, 25, 0.86); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      color: #e6f2dc; font-size: 12px; line-height: 1.55; white-space: pre-wrap; pointer-events: none;
    }
    #badge { color: #bfe58f; font-weight: 700; letter-spacing: 0.06em; }
    #error { color: #ffad9f; }
    #help {
      position: fixed; right: 14px; bottom: 14px; padding: 9px 12px; border-radius: 8px;
      background: rgba(11, 20, 25, 0.78); color: #d8e6d1; font: 12px/1.4 Inter, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="viewport" aria-label="Infinite World W1A sandbox"></div>
  <div id="hud"><span id="badge">W1A / ISOLATED INFINITE WORLD SANDBOX</span>
起動中…</div>
  <div id="help">WASD: 移動　Shift: 高速 Chunk 横断</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script type="module" src="./src/infinite-world/sandbox-main.js"></script>
</body>
</html>
